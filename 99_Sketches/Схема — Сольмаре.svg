<svg viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f6884"/>
    </marker>
    <marker id="road" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6f42"/>
    </marker>
  </defs>

  <!-- суша (равнина вокруг города) -->
  <rect width="1400" height="980" fill="#e7ddc0"/>

  <!-- ============ МОРЕ (восток) ============ -->
  <path d="M1012,60 C1060,180 1030,300 1076,420 C1112,520 1058,650 1096,770 C1120,860 1082,920 1120,980 L1400,980 L1400,60 Z" fill="#bfd2d8"/>
  <path d="M1012,60 C1060,180 1030,300 1076,420 C1112,520 1058,650 1096,770 C1120,860 1082,920 1120,980" fill="none" stroke="#9fbcc4" stroke-width="2"/>
  <text x="1250" y="250" font-size="30" letter-spacing="6" fill="#7d97a0" text-anchor="middle">МОРЕ</text>
  <path d="M1170,330 q18,-10 36,0 M1170,360 q18,-10 36,0 M1230,420 q18,-10 36,0 M1210,560 q18,-10 36,0 M1250,640 q18,-10 36,0" fill="none" stroke="#9fbcc4" stroke-width="2"/>

  <!-- ============ СОЛЁНЫЕ МАРШИ (юг) ============ -->
  <path d="M448,748 C560,770 700,760 820,768 C930,775 1010,788 1120,806 L1120,980 L432,980 C424,884 434,806 448,748 Z" fill="#8fae87" opacity="0.8"/>
  <ellipse cx="600" cy="866" rx="26" ry="12" fill="#d7e4dc" opacity="0.9"/>
  <ellipse cx="672" cy="902" rx="22" ry="10" fill="#d7e4dc" opacity="0.9"/>
  <ellipse cx="536" cy="908" rx="20" ry="9" fill="#d7e4dc" opacity="0.9"/>
  <ellipse cx="760" cy="880" rx="22" ry="10" fill="#d7e4dc" opacity="0.9"/>
  <text x="560" y="840" font-size="17" fill="#4f6a48" font-style="italic">Солёные марши · варницы</text>
  <text x="560" y="930" font-size="12" fill="#4f6a48" font-style="italic">контрабандные тропы · туман · нежить</text>

  <!-- ============ МАРЕНЦА: устьевой бассейн + дельта ============ -->
  <!-- русло с запада к водным воротам -->
  <path d="M0,392 C150,394 320,396 452,399" fill="none" stroke="#7fa3b5" stroke-width="17" stroke-linecap="round"/>
  <!-- устьевой бассейн: вода кругом острова, уходит в море -->
  <path d="M452,399 C540,392 620,389 700,390 C800,391 882,399 950,416 C1006,431 1048,448 1080,474 C1088,506 1080,542 1062,568 C980,566 900,566 800,562 C690,558 600,562 520,550 C476,543 456,516 448,478 C442,450 446,424 452,399 Z" fill="#7fa3b5"/>
  <text x="150" y="378" font-size="15" fill="#5f7b8a" font-style="italic">Маренца →</text>
  <!-- отмели/банки в устье -->
  <ellipse cx="1008" cy="470" rx="10" ry="5" fill="#e7ddc0" stroke="#9fbcc4" stroke-width="1.2"/>
  <ellipse cx="1044" cy="502" rx="9" ry="5" fill="#e7ddc0" stroke="#9fbcc4" stroke-width="1.2"/>
  <ellipse cx="1012" cy="540" rx="8" ry="4" fill="#e7ddc0" stroke="#9fbcc4" stroke-width="1.2"/>
  <text x="1050" y="430" font-size="11" fill="#5f7b8a" font-style="italic">устье — наносы, отмели</text>
  <text x="1050" y="444" font-size="11" fill="#5f7b8a" font-style="italic">гавань мелкая — глубина в Порто-Кьяро</text>
  <text x="1050" y="458" font-size="11" fill="#5f7b8a" font-style="italic">внешний рейд за цепью · перевалка</text>

  <!-- ============ ОСТРОВ-ЯДРО (Читтавеккья) ============ -->
  <path d="M500,470 C556,436 660,428 742,430 C822,432 862,452 872,482 C860,514 808,532 718,536 C618,540 544,532 510,510 C494,497 492,482 500,470 Z" fill="#dccfad" stroke="#8a7f66" stroke-width="2"/>
  <!-- внутренняя стена ядра -->
  <path d="M508,474 C562,444 662,438 740,440 C816,442 854,459 862,482 C852,510 802,526 716,530 C620,534 550,526 518,506 C503,495 502,483 508,474 Z" fill="none" stroke="#6d5f4a" stroke-width="2.5"/>
  <text x="694" y="440" font-size="13" fill="#6d6350" font-style="italic" text-anchor="middle">Читтавеккья · старый город (имя рабочее)</text>

  <!-- ============ ВНЕШНЯЯ СТЕНА (посады снаружи) ============ -->
  <!-- сегменты с разрывами под ворота и водные проходы -->
  <g stroke="#6d5f4a" stroke-width="5" fill="none" stroke-linecap="round">
    <!-- север: T1 (запад от Прибрежных ворот) -->
    <path d="M470,256 L662,256"/>
    <!-- север: T2 + восточная стена сев. берега до кромки устья (416) -->
    <path d="M742,256 L846,256 C906,256 950,300 950,352 L950,416"/>
    <!-- восток юж. берега от кромки устья (566) до низа -->
    <path d="M950,566 L950,656 C950,702 906,720 852,720 L760,720"/>
    <!-- юг: B + западная стена юж. берега до кромки реки (412) -->
    <path d="M680,720 L560,720 C504,720 456,690 456,640 L456,412"/>
    <!-- западная стена сев. берега: от кромки реки (386) к Верхним воротам -->
    <path d="M456,386 L456,344"/>
    <!-- западная стена сев. берега: от Верхних ворот к северу -->
    <path d="M456,322 C456,300 460,284 470,256"/>
  </g>

  <!-- ворота -->
  <g font-size="12" fill="#33302a">
    <circle cx="702" cy="256" r="7" fill="#a8432f"/>
    <text x="702" y="238" text-anchor="middle">Прибрежные ворота</text>
    <text x="702" y="224" text-anchor="middle" font-size="10" fill="#6d6350" font-style="italic">тракт на Порто-Кьяро</text>

    <!-- Верхние ворота — сухопутные, сев. берег -->
    <circle cx="456" cy="333" r="7" fill="#a8432f"/>
    <text x="446" y="316" text-anchor="middle">Верхние ворота</text>
    <text x="446" y="302" text-anchor="middle" font-size="10" fill="#6d6350" font-style="italic">тракт на Фальконере · Сад · поля</text>
    <!-- Речной проран — водные ворота Маренцы (башни + цепь) -->
    <rect x="444" y="375" width="11" height="11" fill="#6d5f4a"/>
    <rect x="444" y="412" width="11" height="11" fill="#6d5f4a"/>
    <path d="M450,388 L450,412" stroke="#6d5f4a" stroke-width="3" stroke-dasharray="3 4"/>
    <text x="434" y="440" text-anchor="middle" font-size="10" fill="#6d6350" font-style="italic">Речной проран · цепь</text>

    <rect x="944" y="406" width="12" height="12" fill="#6d5f4a"/>
    <rect x="944" y="556" width="12" height="12" fill="#6d5f4a"/>
    <path d="M950,420 L950,556" stroke="#6d5f4a" stroke-width="3" stroke-dasharray="3 5"/>
    <text x="966" y="482" text-anchor="start">Морские ворота</text>
    <text x="966" y="497" text-anchor="start" font-size="10" fill="#6d6350" font-style="italic">башни + цепь через устье</text>

    <circle cx="720" cy="720" r="7" fill="#a8432f"/>
    <text x="720" y="742" text-anchor="middle">Болотная калитка</text>
    <text x="720" y="756" text-anchor="middle" font-size="10" fill="#6d6350" font-style="italic">слабая стража · ход барона</text>
  </g>

  <!-- ============ МОСТЫ ============ -->
  <g stroke="#8a7250" stroke-width="6" stroke-linecap="round">
    <path d="M560,388 L560,436"/>
    <path d="M742,390 L742,432"/>
    <path d="M602,528 L602,562"/>
    <path d="M812,528 L812,560"/>
  </g>
  <text x="606" y="576" font-size="10" fill="#6d6350" font-style="italic">Мост каталажки (раб.)</text>

  <!-- ============ РАЙОН: ВЕРХНИЙ / РЕМЁСЛА (северный берег) ============ -->
  <text x="600" y="300" font-size="18" letter-spacing="1" fill="#7a6f56" text-anchor="middle" font-style="italic">ВЕРХНИЙ · ремёсла (раб.)</text>
  <g font-size="12" fill="#33302a">
    <rect x="700" y="278" width="11" height="11" fill="#4a403b"/>
    <text x="716" y="288">Каравансарай Союза</text>
    <rect x="512" y="366" width="10" height="10" fill="#4a403b"/>
    <text x="500" y="362" text-anchor="end">Речные пристани</text>
    <rect x="592" y="330" width="10" height="10" fill="#4a403b"/>
    <text x="608" y="339">Цеха · мельницы</text>
    <rect x="770" y="322" width="10" height="10" fill="#4a403b"/>
    <text x="786" y="331">Винные погреба</text>
    <path d="M556,320 l-6,10 12,0 z" fill="#4a403b"/>
    <text x="540" y="326" text-anchor="end">Анклав Темпуса ⌂</text>
  </g>

  <!-- ============ РАЙОН: МАРИНА / порт (южный берег) ============ -->
  <text x="600" y="710" font-size="16" letter-spacing="1" fill="#7a6f56" text-anchor="middle" font-style="italic">МАРИНА · порт (раб.)</text>
  <g font-size="12" fill="#33302a">
    <rect x="906" y="586" width="11" height="11" fill="#4a403b"/>
    <text x="922" y="596">Таможня</text>
    <rect x="878" y="600" width="11" height="11" fill="#4a403b"/>
    <text x="894" y="610">Арсенал · верфь</text>
    <rect x="786" y="642" width="11" height="11" fill="#4a403b"/>
    <text x="778" y="652" text-anchor="end">Житница</text>
    <rect x="712" y="678" width="10" height="10" fill="#4a403b"/>
    <text x="704" y="687" text-anchor="end">Рыбный рынок</text>
    <!-- внутренний мол (лихтеры, барки, каботаж) -->
    <path d="M905,570 C945,556 975,548 1000,542" fill="none" stroke="#8a7250" stroke-width="6" stroke-linecap="round"/>
    <text x="946" y="566" font-size="11" fill="#6d6350" font-style="italic">мол · внутренние пристани</text>
  </g>

  <!-- ============ ВНЕШНИЙ ПОРТ (за стенами / за цепью) ============ -->
  <!-- внешний глубокий причал: большие суда за цепью -->
  <path d="M985,592 C1016,580 1042,570 1062,560" fill="none" stroke="#8a7250" stroke-width="6" stroke-linecap="round"/>
  <path d="M1038,560 l18,0 l-3,6 l-12,0 z" fill="#5b5048"/><line x1="1047" y1="560" x2="1047" y2="550" stroke="#5b5048" stroke-width="1.5"/>
  <text x="1000" y="606" font-size="11" fill="#33302a">внешний причал · большие суда</text>
  <!-- рейд: суда на якоре, перевалка -->
  <g fill="#5b5048">
    <path d="M1010,474 l16,0 l-3,5 l-10,0 z"/><line x1="1018" y1="474" x2="1018" y2="466" stroke="#5b5048" stroke-width="1.5"/>
    <path d="M1044,500 l16,0 l-3,5 l-10,0 z"/><line x1="1052" y1="500" x2="1052" y2="491" stroke="#5b5048" stroke-width="1.5"/>
  </g>
  <!-- рыбацкий посад на лагуне (вне стен, юг) -->
  <path d="M556,750 C610,750 656,750 690,750" fill="none" stroke="#8a7250" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <g fill="#5b5048">
    <path d="M626,760 l12,0 l-2,4 l-8,0 z"/>
    <path d="M656,770 l12,0 l-2,4 l-8,0 z"/>
    <path d="M600,776 l10,0 l-2,3 l-6,0 z"/>
  </g>
  <text x="556" y="742" font-size="12" fill="#33302a" text-anchor="middle">Рыбацкий посад · причалы</text>

  <!-- ============ ЯДРО: постройки ============ -->
  <g font-size="12" fill="#33302a">
    <rect x="576" y="464" width="12" height="12" fill="#4a403b"/>
    <text x="570" y="460" text-anchor="end">Ратуша (Совет)</text>
    <path d="M690,452 c4,-9 12,-9 16,0 c9,-4 14,3 9,10 c6,7 -2,14 -9,10 c-3,8 -13,8 -16,0 c-8,3 -14,-4 -9,-10 c-5,-7 1,-13 9,-10 z" fill="#6f8f63"/>
    <text x="704" y="452">Собор Виреллы</text>
    <rect x="758" y="494" width="11" height="11" fill="#4a403b"/>
    <text x="774" y="504">Дом Сальвиати</text>
    <rect x="592" y="518" width="11" height="11" fill="#4a403b"/>
    <text x="586" y="527" text-anchor="end">Суд · каталажка</text>
  </g>

  <!-- ============ ЗАСТЕНЬЕ ============ -->
  <!-- некрополь (за стеной, ЮЗ — сухой пригорок у кромки маршей) -->
  <g>
    <ellipse cx="372" cy="724" rx="66" ry="32" fill="#ded2b4" stroke="#8a7f66" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="372" y="710" font-size="14" fill="#5d534e" text-anchor="middle">Некрополь ✝ (за стеной, ЮЗ)</text>
    <path d="M344,724 v13 M338,729 h12 M376,724 v13 M370,729 h12 M404,722 v13 M398,727 h12" stroke="#5d534e" stroke-width="2"/>
    <text x="372" y="752" font-size="11" fill="#6d6350" font-style="italic" text-anchor="middle">сухой пригорок у кромки маршей</text>
  </g>
  <!-- шрам мора → беженцы (снаружи западной стены) -->
  <ellipse cx="352" cy="486" rx="70" ry="46" fill="#b5aaa2" opacity="0.8"/>
  <text x="352" y="480" font-size="12" fill="#5d534e" text-anchor="middle">Шрам мора</text>
  <text x="352" y="496" font-size="11" fill="#5d534e" text-anchor="middle" font-style="italic">заселяют беженцы голода</text>
  <rect x="404" y="536" width="10" height="10" fill="#4a403b"/>
  <text x="420" y="545" font-size="12" fill="#33302a">Богадельня (раздача хлеба)</text>
  <text x="300" y="590" font-size="12" fill="#8a7f66" font-style="italic">посады растут вне стен →</text>

  <!-- ============ ДОРОГИ НАРУЖУ (player-facing) ============ -->
  <g stroke="#8a6f42" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
    <path d="M448,338 C340,362 200,412 100,466" marker-end="url(#road)"/>
    <path d="M702,250 C700,180 700,130 700,86" marker-end="url(#road)"/>
    <path d="M960,478 C1010,470 1050,464 1096,458" marker-end="url(#road)"/>
    <path d="M720,730 C720,752 720,766 720,784" marker-end="url(#road)"/>
  </g>
  <!-- цели дорог -->
  <rect x="86" y="486" width="12" height="14" fill="#4a403b"/>
  <text x="82" y="524" font-size="13" fill="#33302a" text-anchor="middle">Фальконере</text>
  <path d="M150,430 c4,-9 12,-9 16,0 c9,-4 14,3 9,10 c6,7 -2,14 -9,10 c-3,8 -13,8 -16,0 c-8,3 -14,-4 -9,-10 c-5,-7 1,-13 9,-10 z" fill="#6f8f63"/>
  <text x="134" y="436" font-size="12" fill="#4c6343" text-anchor="end">Летний Сад · поля</text>
  <text x="714" y="150" font-size="13" fill="#8a6f42" font-style="italic" text-anchor="start">→ Порто-Кьяро</text>
  <text x="1006" y="520" font-size="12" fill="#8a6f42" font-style="italic">→ Караванный Союз · морские пути</text>

  <!-- ============ МАСТЕРСКИЙ СЛОЙ (снять для игроков) ============ -->
  <g fill="#3f6884" font-style="italic" font-size="11">
    <text x="570" y="448" text-anchor="end">штурм ратуши · portent 3</text>
    <text x="778" y="666" text-anchor="end">порча зерна · улика B</text>
    <text x="372" y="772" text-anchor="middle">G1 · ночная нежить → уходит в марши</text>
    <text x="352" y="512" text-anchor="middle">толпа для «протестов» · portent 2</text>
    <text x="560" y="812" text-anchor="start">тихий ход барона в марши</text>
  </g>

  <!-- ============ КОМПАС ============ -->
  <g transform="translate(1330,110)">
    <line x1="0" y1="24" x2="0" y2="-16" stroke="#4a403b" stroke-width="2"/>
    <path d="M0,-24 l7,16 l-7,-5 l-7,5 z" fill="#4a403b"/>
    <text x="0" y="-30" font-size="14" fill="#4a403b" text-anchor="middle">С</text>
  </g>

  <!-- ============ ЗАГОЛОВОК / ЗАМЕТКИ ============ -->
  <text x="700" y="46" font-size="30" letter-spacing="3" fill="#33302a" text-anchor="middle">СОЛЬМАРЕ · план-подмалёвок</text>
  <text x="700" y="70" font-size="14" fill="#6d6350" text-anchor="middle" font-style="italic">остров-ядро в дельте Маренцы · мастерская версия (синие метки A1 — снять для игроков)</text>
  <text x="700" y="962" font-size="13" fill="#6d6350" text-anchor="middle" font-style="italic">≈10 000 жителей · из конца в конец ~полчаса пешком · сейчас пухнет от беженцев голода · имена районов рабочие</text>

  <!-- ============ ЛЕГЕНДА ============ -->
  <g transform="translate(40,800)" font-size="12" fill="#33302a">
    <rect x="0" y="0" width="256" height="166" fill="#efe7d2" stroke="#8a7f66" stroke-width="1"/>
    <text x="12" y="22" font-size="13" fill="#33302a" font-style="italic">Легенда</text>
    <circle cx="20" cy="42" r="6" fill="#a8432f"/><text x="34" y="46">сухие ворота</text>
    <line x1="152" y1="42" x2="182" y2="42" stroke="#6d5f4a" stroke-width="5"/><text x="190" y="46">стена</text>
    <rect x="15" y="60" width="7" height="7" fill="#6d5f4a"/><rect x="15" y="74" width="7" height="7" fill="#6d5f4a"/><path d="M18.5,67 L18.5,74" stroke="#6d5f4a" stroke-width="2" stroke-dasharray="2 2"/><text x="30" y="74">водные ворота (цепь)</text>
    <line x1="15" y1="98" x2="31" y2="98" stroke="#8a7250" stroke-width="6"/><text x="40" y="102">мост / мол</text>
    <rect x="152" y="92" width="11" height="11" fill="#4a403b"/><text x="190" y="102">здание</text>
    <path d="M15,120 h20" stroke="#7fa3b5" stroke-width="8"/><text x="45" y="124">протока</text>
    <path d="M152,120 h24" stroke="#8a6f42" stroke-width="2.5" stroke-dasharray="6 4"/><text x="190" y="124">дорога</text>
    <text x="15" y="146" font-size="11" fill="#3f6884" font-style="italic">синим — мастерские метки (снять)</text>
    <text x="15" y="162" font-size="11" fill="#6d6350" font-style="italic">рабочие имена помечены «(раб.)»</text>
  </g>
</svg>
