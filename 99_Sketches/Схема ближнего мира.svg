<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f6884"/>
    </marker>
  </defs>

  <!-- океан -->
  <rect width="1600" height="1000" fill="#bfd2d8"/>

  <!-- ============ ВАЛАНТИЯ (срезана западным обрезом) ============ -->
  <path d="M0,110 C180,90 330,150 395,240 C465,335 530,390 548,470 C562,565 505,655 430,725 C345,805 200,865 0,890 Z"
        fill="#e7ddc0" stroke="#8a7f66" stroke-width="2.5"/>
  <text x="150" y="180" font-size="34" letter-spacing="6" fill="#6d6350">ВАЛАНТИЯ</text>
  <text x="150" y="208" font-size="15" fill="#8a7f66" font-style="italic">материк продолжается на запад…</text>

  <!-- мёртвые земли + Аструм -->
  <ellipse cx="225" cy="480" rx="155" ry="140" fill="#b5aaa2" stroke="#7c716b" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.85"/>
  <text x="225" y="415" font-size="15" fill="#5d534e" text-anchor="middle" font-style="italic">мёртвые земли · кольцо руин-пригородов</text>
  <text x="225" y="487" font-size="24" text-anchor="middle" fill="#4a403b">✸ Аструм</text>
  <text x="225" y="510" font-size="14" text-anchor="middle" fill="#5d534e">павший город · над Сердцем</text>
  <circle cx="330" cy="562" r="13" fill="#7a4a32"/><text x="330" y="567" font-size="13" fill="#fff" text-anchor="middle">А6</text>

  <!-- Солариум -->
  <text x="465" y="385" font-size="20" letter-spacing="2" fill="#6d6350" text-anchor="middle">СОЛАРИУМ</text>
  <circle cx="470" cy="425" r="7" fill="#4a403b"/>
  <text x="486" y="430" font-size="16" fill="#33302a">Аркс Люцис</text>
  <circle cx="520" cy="480" r="4" fill="#4a403b" opacity="0.6"/>
  <text x="532" y="485" font-size="13" fill="#6d6350" font-style="italic">порт-ворота — ?</text>
  <circle cx="540" cy="415" r="13" fill="#7a4a32"/><text x="540" y="420" font-size="13" fill="#fff" text-anchor="middle">А4</text>
  <text x="465" y="360" font-size="13" fill="#8a7f66" font-style="italic" text-anchor="middle">«щит» между берегом и центром</text>

  <!-- Браздур, чертоги -->
  <path d="M45,600 l12,-22 12,22 z M72,606 l12,-22 12,22 z M30,628 l12,-22 12,22 z" fill="#7d6f57"/>
  <circle cx="70" cy="645" r="6" fill="#4a403b"/>
  <text x="84" y="650" font-size="16" fill="#33302a">Браздур</text>
  <text x="84" y="668" font-size="13" fill="#6d6350" font-style="italic">подгорное кор-во дварфов</text>
  <text x="160" y="575" font-size="13" fill="#8a7f66" font-style="italic">⌂ покинутые чертоги</text>

  <!-- ============ ВЕЗАНТИЯ ============ -->
  <path d="M1120,205 C1175,130 1330,108 1432,158 C1523,203 1545,300 1503,382 C1462,458 1350,512 1240,492 C1130,472 1082,382 1092,300 C1097,252 1102,232 1120,205 Z"
        fill="#e7ddc0" stroke="#8a7f66" stroke-width="2.5"/>
  <text x="1300" y="155" font-size="26" letter-spacing="4" fill="#6d6350" text-anchor="middle">ВЕЗАНТИЯ</text>

  <!-- горы Везантии -->
  <path d="M1150,320 l14,-26 14,26 z M1185,300 l14,-26 14,26 z M1220,320 l14,-26 14,26 z M1255,300 l14,-26 14,26 z M1180,355 l14,-26 14,26 z M1245,352 l14,-26 14,26 z" fill="#7d6f57"/>
  <!-- Маренца -->
  <path d="M1290,345 C1340,355 1385,370 1420,368 C1455,366 1478,360 1497,362" fill="none" stroke="#7fa3b5" stroke-width="4" stroke-linecap="round"/>
  <text x="1400" y="388" font-size="12" fill="#5f7b8a" font-style="italic">Маренца</text>

  <circle cx="1497" cy="362" r="7" fill="#4a403b"/>
  <text x="1490" y="345" font-size="17" fill="#33302a" text-anchor="end">Сольмаре</text>
  <circle cx="1532" cy="330" r="13" fill="#7a4a32"/><text x="1532" y="335" font-size="13" fill="#fff" text-anchor="middle">А1</text>

  <path d="M1432,296 c4,-9 12,-9 16,0 c9,-4 14,3 9,10 c6,7 -2,14 -9,10 c-3,8 -13,8 -16,0 c-8,3 -14,-4 -9,-10 c-5,-7 1,-13 9,-10 z" fill="#6f8f63"/>
  <text x="1424" y="282" font-size="14" fill="#4c6343" text-anchor="end">Летний Сад</text>

  <rect x="1396" y="398" width="10" height="12" fill="#4a403b"/>
  <text x="1390" y="425" font-size="14" fill="#33302a" text-anchor="end">Фальконере</text>

  <circle cx="1425" cy="172" r="6" fill="#4a403b"/>
  <text x="1440" y="177" font-size="15" fill="#33302a">Порто-Кьяро</text>
  <circle cx="1409" cy="150" r="12" fill="#7a4a32"/><text x="1409" y="155" font-size="12" fill="#fff" text-anchor="middle">А2</text>

  <rect x="1295" y="325" width="11" height="11" fill="#4a403b"/>
  <text x="1310" y="322" font-size="14" fill="#33302a">Лумаредо</text>
  <text x="1310" y="338" font-size="11" fill="#6d6350" font-style="italic">крепость-перевал</text>

  <circle cx="1222" cy="270" r="6" fill="#4a403b"/>
  <text x="1218" y="255" font-size="14" fill="#33302a" text-anchor="middle">Тарнхольд</text>

  <text x="1165" y="405" font-size="15" fill="#5c6e4f" font-style="italic">Нагорья</text>
  <circle cx="1160" cy="432" r="5" fill="#4a403b"/>
  <text x="1172" y="437" font-size="13" fill="#33302a">Урнаг-Долл</text>

  <!-- ============ ХАДДУМ (срезан нижним/правым обрезом) ============ -->
  <path d="M1022,705 C1085,638 1205,612 1332,628 C1452,643 1560,636 1600,655 L1600,1000 L1052,1000 C1010,905 992,782 1022,705 Z"
        fill="#e7ddc0" stroke="#8a7f66" stroke-width="2.5"/>
  <!-- пустыня -->
  <path d="M1060,760 C1140,720 1300,705 1440,720 C1540,731 1590,740 1600,745 L1600,880 C1500,895 1250,900 1120,880 C1070,870 1050,820 1060,760 Z"
        fill="#e0cb96" opacity="0.9"/>
  <text x="1120" y="755" font-size="26" letter-spacing="4" fill="#6d6350">ХАДДУМ</text>
  <text x="1440" y="790" font-size="16" fill="#a3855a" font-style="italic" text-anchor="middle">пустыня (растёт)</text>

  <circle cx="1232" cy="662" r="7" fill="#4a403b"/>
  <text x="1248" y="660" font-size="17" fill="#33302a">Айн-Сарим</text>
  <text x="1248" y="678" font-size="12" fill="#6d6350" font-style="italic">«Город Глаз», магократия</text>
  <circle cx="1213" cy="640" r="13" fill="#7a4a32"/><text x="1213" y="645" font-size="13" fill="#fff" text-anchor="middle">А3</text>
  <circle cx="1110" cy="695" r="4" fill="#4a403b" opacity="0.6"/>
  <circle cx="1420" cy="668" r="4" fill="#4a403b" opacity="0.6"/>
  <text x="1432" y="673" font-size="12" fill="#6d6350" font-style="italic">малые порты — б/и</text>

  <!-- караванная дорога и оазисы -->
  <path d="M1232,670 C1245,710 1265,760 1290,810 C1305,842 1318,875 1328,905" fill="none" stroke="#8a6f42" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="1252" cy="722" r="5" fill="#6f8f63"/>
  <circle cx="1281" cy="788" r="5" fill="#6f8f63"/>
  <circle cx="1312" cy="858" r="5" fill="#6f8f63"/>
  <text x="1345" y="812" font-size="12" fill="#8a6f42" font-style="italic">оазисы + маяки Гильдии</text>

  <!-- эльфийские леса — королевство Эландрия -->
  <path d="M1140,930 C1250,900 1420,895 1600,912 L1600,1000 L1150,1000 C1135,975 1132,950 1140,930 Z" fill="#6f8f63" opacity="0.85"/>
  <text x="1455" y="940" font-size="20" letter-spacing="3" fill="#f2efe2" text-anchor="middle">ЭЛАНДРИЯ</text>
  <text x="1455" y="958" font-size="12" fill="#eef3ea" text-anchor="middle" font-style="italic">королевство эльфов · прародина</text>
  <!-- столица -->
  <circle cx="1300" cy="978" r="10" fill="none" stroke="#2b2925" stroke-width="1.2"/>
  <circle cx="1300" cy="978" r="6" fill="#2b2925"/>
  <text x="1315" y="975" font-size="15" fill="#f2efe2">Аннувэль</text>
  <text x="1315" y="991" font-size="11" fill="#eef3ea" font-style="italic">столица</text>

  <!-- ============ МОРЕ ============ -->
  <circle cx="1345" cy="568" r="6" fill="#4a403b"/>
  <text x="1360" y="565" font-size="14" fill="#33302a">Мирсаль</text>
  <text x="1360" y="581" font-size="11" fill="#6d6350" font-style="italic">погасший маяк (А3, акт I)</text>

  <!-- маршруты (мастерский слой) -->
  <path d="M1497,375 C1480,450 1420,520 1360,556" fill="none" stroke="#3f6884" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M1338,580 C1310,610 1270,635 1245,652" fill="none" stroke="#3f6884" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="1428" y="490" font-size="14" fill="#3f6884" font-style="italic">~1–2 недели</text>

  <path d="M1497,352 C1350,240 900,300 620,410 C575,428 545,440 528,462" fill="none" stroke="#3f6884" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="900" y="300" font-size="14" fill="#3f6884" font-style="italic">~месяц · флот в сцепке (А4)</text>

  <path d="M1180,915 C1160,945 1150,965 1145,990" fill="none" stroke="#3f6884" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="1108" y="935" font-size="13" fill="#3f6884" font-style="italic" text-anchor="end">дальний южный океан → Катена</text>
  <text x="1108" y="952" font-size="12" fill="#3f6884" font-style="italic" text-anchor="end">(А5 · недели · на картах её нет)</text>

  <!-- заголовок и заметки -->
  <text x="800" y="55" font-size="30" letter-spacing="3" fill="#33302a" text-anchor="middle">МУНДУС · БЛИЖНИЙ МИР</text>
  <text x="800" y="80" font-size="15" fill="#6d6350" text-anchor="middle" font-style="italic">схема-подмалёвок для Inkarnate · мастерская версия (маршруты и А1–А6 — снять для игроков)</text>
  <text x="800" y="960" font-size="14" fill="#6d6350" text-anchor="middle" font-style="italic">суша уходит за обрез листа — мир продолжается, но не зафиксирован · диск и край мира не показывать</text>
</svg>
