<rect width="1240" height="740" fill="#161b22"/>
<g font-family="DejaVu Sans, sans-serif" fill="#e6edf3">
<text x="40" y="45" font-size="26" font-weight="bold">Нычка Бруно · предложение планировки</text>
<text x="40" y="76" font-size="15" fill="#a1abb9">Схема связей, без масштаба. Задняя дверь, вентиль и расстановка в бою ещё не приняты.</text>
<g stroke="#8391a1" stroke-width="4" fill="none">
<path d="M220 200 H300 M130 280 V390 M520 470 H600 M520 200 H600 M750 380 H830"/>
</g>
<g stroke-width="3">
<rect x="40" y="120" width="180" height="160" rx="7" fill="#222e3a" stroke="#8391a1"/>
<rect x="300" y="120" width="220" height="160" rx="7" fill="#3b2b29" stroke="#e9a16b"/>
<rect x="40" y="390" width="480" height="160" rx="7" fill="#222e3a" stroke="#8391a1"/>
<rect x="600" y="120" width="150" height="430" rx="7" fill="#222e3a" stroke="#8391a1"/>
<rect x="830" y="210" width="360" height="340" rx="7" fill="#222e3a" stroke="#8391a1"/>
</g>
<g text-anchor="middle" font-size="19" font-weight="bold">
<text x="130" y="171">1. Прихожая</text><text x="410" y="160">2. Приёмная</text>
<text x="280" y="432">3. Кладовая и служебный обход</text>
<text x="675" y="320">4. Коридор</text><text x="1010" y="246">5. Комната Бруно</text>
</g>
<g font-size="15" text-anchor="middle" fill="#a1abb9">
<text x="130" y="210">Развилка</text><text x="410" y="193">Нажимная плита</text>
<text x="410" y="218" fill="#e9a16b">Сюда поступает газ</text>
<text x="280" y="471">Второй путь к коридору и задней двери приёмной</text>
<text x="280" y="499">Помощь отрезанным или обход ловушки целиком</text>
<text x="675" y="348">Открывает</text><text x="675" y="371">заднюю дверь</text>
</g>
<path d="M130 120 V93" stroke="#a1abb9" stroke-width="3"/>
<text x="165" y="110" font-size="14">Вход</text>
