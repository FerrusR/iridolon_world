<text x="1000" y="440" text-anchor="middle" font-size="14" fill="#ef9999">Подвижные лезвия</text>
<rect x="1140" y="278" width="26" height="20" fill="#4a725c" stroke="#8bd3aa" stroke-width="2"/>
