<rect x="1110" y="468" width="60" height="35" fill="#5c4736" stroke="#b99c7a" stroke-width="2"/>
<text x="1095" y="529" font-size="14">Бруно / стол</text>
<rect x="856" y="285" width="53" height="34" fill="#39434d" stroke="#8391a1" stroke-width="2"/>
<rect x="852" y="465" width="62" height="37" fill="#39434d" stroke="#8391a1" stroke-width="2"/>
<text x="40" y="607" font-size="18" font-weight="bold">Короткий путь: 1 → 2 → 4 → 5</text>
<text x="40" y="638" font-size="18" font-weight="bold">Обход: 1 → 3 → 4 → 5</text>
<text x="40" y="680" font-size="15" fill="#a1abb9">Из комнаты 2 можно поднимать дверь, останавливать газ или вскрывать заднюю дверь.</text>
<text x="40" y="706" font-size="15" fill="#a1abb9">Герои снаружи могут помогать у падающей двери либо обойти через 3 и снять засов из 4.</text>
</g></svg>
