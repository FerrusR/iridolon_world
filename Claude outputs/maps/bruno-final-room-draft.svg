<text x="300" y="638" text-anchor="middle" font-size="17">Вход / запираемая дверь</text>
<text x="595" y="132" font-size="19" fill="#f3d58c" font-weight="bold">Галерея +10 feet</text>
<text x="595" y="160" font-size="16" fill="#e6edf3" font-weight="normal">Лезвия вращаются внизу, на уровне пола.</text>
<text x="595" y="188" font-size="16" fill="#e6edf3" font-weight="normal">Две вертикальные лестницы: A2 и F2.</text>
<text x="595" y="216" font-size="16" fill="#e6edf3" font-weight="normal">Б — Бруно; L — два рычага.</text>
<text x="595" y="244" font-size="16" fill="#a1abb9" font-weight="normal">Низкий борт даёт cover от части выстрелов.</text>
<text x="595" y="272" font-size="16" fill="#e6edf3" font-weight="normal"></text>
<text x="595" y="300" font-size="19" fill="#e6edf3" font-weight="bold">Основной пол +0 feet</text>
<text x="595" y="328" font-size="16" fill="#e6edf3" font-weight="normal">Красный механизм — машина на узле сетки.</text>
<text x="595" y="356" font-size="16" fill="#8bd3aa" font-weight="normal">P — панель отключения, доступна с пола.</text>
<text x="595" y="384" font-size="16" fill="#e9a16b" font-weight="normal">T — две нажимные плиты запуска.</text>
<text x="595" y="412" font-size="16" fill="#a1abb9" font-weight="normal">Серые ящики — укрытия / преграды.</text>
<text x="595" y="440" font-size="16" fill="#e6edf3" font-weight="normal"></text>
<text x="595" y="468" font-size="19" fill="#e6edf3" font-weight="bold">У рычагов</text>
<text x="595" y="496" font-size="16" fill="#e6edf3" font-weight="normal">1 action — закрыть и запереть вход.</text>
<text x="595" y="524" font-size="16" fill="#e6edf3" font-weight="normal">1 action — запустить машину.</text>
<text x="595" y="552" font-size="16" fill="#e6edf3" font-weight="normal">1 action — снять запор с входа.</text>
<text x="595" y="580" font-size="16" fill="#a1abb9" font-weight="normal">Рычагами могут пользоваться и герои.</text>
<text x="40" y="691" font-size="15" fill="#a1abb9">Initiative до запирания и запуска. Галерея защищает от машины любого, кто туда добрался.</text>
</g></svg>